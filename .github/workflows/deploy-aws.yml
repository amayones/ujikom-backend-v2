name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to AWS
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Generate deployment package
      run: |
        zip -r deploy.zip . -x '*.git*' 'node_modules/*' 'vendor/*' 'storage/logs/*' '.env'
        ls -lh deploy.zip
    
    - name: Get timestamp
      id: time
      run: echo "time=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
    
    - name: Deploy to Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v21
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: absolute-cinema-backend
        environment_name: absolute-cinema-backend-env
        version_label: "v-${{ steps.time.outputs.time }}-${{ github.sha }}"
        region: us-east-1
        deployment_package: deploy.zip
        wait_for_deployment: true
        wait_for_environment_recovery: 300
    
    - name: Deployment success
      if: success()
      run: |
        echo "✅ Deployment successful!"
        echo "🌐 URL: http://absolute-cinema-backend.us-east-1.elasticbeanstalk.com"
