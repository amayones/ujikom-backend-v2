name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/ujikom-backend-v2
          git pull origin main
          
          echo "Stopping old container..."
          docker stop backend || true
          docker rm backend || true
          
          echo "Building new image..."
          docker build -t cinema-backend .
          
          echo "Starting container with migrations enabled..."
          docker run -d \
            -p 80:80 \
            -p 443:443 \
            -v /etc/letsencrypt:/etc/letsencrypt:ro \
            -v /var/www/certbot:/var/www/certbot \
            -e RUN_MIGRATIONS=true \
            --name backend \
            --env-file .env \
            cinema-backend
          
          echo "Waiting for container to initialize..."
          sleep 15
          
          echo "Checking container status..."
          docker ps | grep backend
          
          echo "Running seeding script..."
          docker exec backend chmod +x deploy-seed-fix.sh
          
          if docker exec backend ./deploy-seed-fix.sh; then
            echo "✓ Seeding completed via script"
          else
            echo "⚠ Script failed, trying manual seeding..."
            sleep 5
            
            # Manual seeding with maximum retry
            docker exec backend php artisan migrate:fresh --force || exit 1
            sleep 5
            
            for SEEDER in UserSeeder StudioSeeder FilmSeeder SeatSeeder PriceSeeder ScheduleSeeder OrderSeeder; do
              echo "Seeding $SEEDER..."
              
              for ATTEMPT in {1..5}; do
                if docker exec backend php artisan db:seed --class=$SEEDER --force; then
                  echo "✓ $SEEDER done"
                  sleep 2
                  break
                elif [ $ATTEMPT -eq 5 ]; then
                  echo "✗ $SEEDER failed"
                  docker logs backend --tail 100
                  exit 1
                else
                  echo "  Retry $ATTEMPT/5..."
                  sleep 4
                fi
              done
            done
          fi
          
          echo "Verifying seeded data..."
          docker exec backend php artisan tinker --execute="
            echo 'Users: ' . \App\Models\User::count();
            echo 'Films: ' . \App\Models\Film::count();
            echo 'Studios: ' . \App\Models\Studio::count();
          "
          
          echo "Clearing caches..."
          docker exec backend php artisan config:clear
          docker exec backend php artisan cache:clear
          docker exec backend php artisan route:clear
          docker exec backend php artisan view:clear
          
          echo "✓ Deployment completed successfully"
