name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/ujikom-backend-v2
          git pull origin main
          docker stop backend || true
          docker rm backend || true
          docker build -t cinema-backend .
          docker run -d \
            -p 80:80 \
            -p 443:443 \
            -v /etc/letsencrypt:/etc/letsencrypt:ro \
            -v /var/www/certbot:/var/www/certbot \
            --name backend \
            --env-file .env \
            cinema-backend
          docker exec backend php artisan migrate:fresh --seed --force
          docker exec backend php artisan config:clear
          docker exec backend php artisan cache:clear
          docker exec backend php artisan route:clear
